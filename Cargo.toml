[package]
name = "reviewers"
version = "0.4.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
crossterm = "0.29.0"
ctrlc = "3.5.2"
getrandom = "0.4.3"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = "3.4.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
