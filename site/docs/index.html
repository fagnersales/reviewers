<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docs · reviewers</title>
<link rel="preload" href="/fonts/fira-code-300-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="masthead">
  <a class="wordmark" href="/"><span class="corner">┌</span> reviewers</a>
  <nav><a href="/docs/" aria-current="page">docs</a><a href="/llms.txt">llms.txt</a><a href="/#install">install</a></nav>
</header>
<main class="doc" id="docs">Loading…</main>
<footer class="colophon">
  <nav><a href="/docs/">docs</a><a href="/install">install.sh</a><a href="/llms.txt">llms.txt</a></nav>
</footer>
<script>
  // The same guide `reviewers help --agent` prints, so the site and the agents read one text.
  const escape = (text) => text.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const inline = (text) =>
    escape(text)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

  function render(markdown) {
    const out = [];
    let paragraph = [], list = null, fence = null;
    const closeParagraph = () => {
      if (paragraph.length) out.push(`<p>${inline(paragraph.join(" "))}</p>`);
      paragraph = [];
    };
    const closeList = () => {
      if (list) out.push(list === "args" ? "</ul>" : `</${list}>`);
      list = null;
    };
    const open = (kind) => {
      if (list === kind) return;
      closeList();
      out.push(kind === "args" ? '<ul class="args">' : `<${kind}>`);
      list = kind;
    };
    for (const line of markdown.split("\n")) {
      if (fence !== null) {
        if (line.startsWith("```")) { out.push(`<pre><code>${escape(fence.join("\n"))}</code></pre>`); fence = null; } else fence.push(line);
        continue;
      }
      if (line.startsWith("```")) { closeParagraph(); closeList(); fence = []; continue; }
      if (line.trim() === "---") { closeParagraph(); closeList(); out.push("<hr>"); continue; }
      const heading = line.match(/^(#{1,4}) (.*)$/);
      if (heading) { closeParagraph(); closeList(); out.push(`<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`); continue; }
      // A command's arguments: `  --flag <VALUE>: what it does`
      const argument = line.match(/^ {2}((?:--|<)\S.*)$/);
      if (argument) { closeParagraph(); open("args"); out.push(`<li>${inline(argument[1])}</li>`); continue; }
      const item = line.match(/^\s*(?:[-*]|(\d+)\.) (.*)$/);
      if (item) { closeParagraph(); open(item[1] ? "ol" : "ul"); out.push(`<li>${inline(item[2])}</li>`); continue; }
      if (!line.trim()) { closeParagraph(); closeList(); continue; }
      paragraph.push(line.trim());
    }
    closeParagraph();
    closeList();
    return out.join("\n");
  }

  fetch("/docs.md").then((response) => response.text()).then((text) => { document.getElementById("docs").innerHTML = render(text); });
</script>
</body>
</html>
