# Builds every binary on each `v*` tag and publishes them, with the `latest.txt` manifest the
# installer and `reviewers upgrade` read, as a GitHub Release. reviewers.sh/releases/latest.txt
# redirects to the latest release's copy. Run it by hand to build without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds run on Macs, so Apple's linker signs them (an unsigned arm64 binary is killed on launch).
          - { target: aarch64-apple-darwin, os: macos-14, runs: true, zig: false }
          - { target: x86_64-apple-darwin, os: macos-15-intel, runs: true, zig: false }
          # Linux builds link against glibc 2.17 through zig, so they run on any distribution from the last decade.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, runs: true, zig: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, runs: false, zig: true }
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Python, for zig
        if: matrix.zig
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: zig and cargo-zigbuild
        if: matrix.zig
        run: pip install cargo-zigbuild

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}.2.17
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
          mkdir -p dist
          cp target/${{ matrix.target }}/release/reviewers dist/reviewers-${{ matrix.target }}

      - name: Smoke test
        if: matrix.runs
        run: |
          dist/reviewers-${{ matrix.target }} --version
          dist/reviewers-${{ matrix.target }} help --agent | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: reviewers-${{ matrix.target }}
          path: dist/reviewers-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checkout can leave the tag without its message, which holds the release notes.
      - run: git fetch --tags --force

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Manifest
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          cargo_version=$(awk -F'"' '/^version/ { print $2; exit }' Cargo.toml)
          if [ "$version" != "$cargo_version" ]; then
            echo "tag $tag doesn't match Cargo.toml's version $cargo_version"
            exit 1
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          {
            echo "version $version"
            git tag -l --format='%(contents)' "$tag" | sed '/^-----BEGIN/,$d' | awk 'NF { print "note " $0 }'
            for file in dist/reviewers-*; do
              target="${file#dist/reviewers-}"
              echo "$target $base/reviewers-$target $(sha256sum "$file" | awk '{ print $1 }')"
            done
          } > dist/latest.txt
          cat dist/latest.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '$1 == "note" { sub(/^note /, "- "); print }' dist/latest.txt)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes "${notes:-Release $GITHUB_REF_NAME}"
